<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo Market - US Market</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
            --border: #334155;
            --blue: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
        h1 { font-size: 1.1rem; }
        button { background: var(--blue); color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .table-container { width: 100%; overflow-x: auto; background: var(--card); border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; background: rgba(255,255,255,0.02); }
        tr:last-child td { border-bottom: none; }
        .pos { color: var(--green); font-weight: 600; }
        .neg { color: var(--red); font-weight: 600; }
        #status { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; }
    </style>
</head>
<body>

    <header>
        <h1>US Market — Cotizaciones</h1>
        <button onclick="cargarPrecios()">Actualizar</button>
    </header>

    <div id="status">Cargando datos...</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Ticker</th>
                    <th>Precio (USD)</th>
                    <th>Cambio Diario</th>
                </tr>
            </thead>
            <tbody id="tabla-body">
                <tr><td colspan="3" style="text-align:center; color:var(--muted);">Cargando...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const TICKERS = ["AAPL", "MSFT", "GOOGL", "NVDA", "TSLA", "AMZN", "META"];

        async function cargarPrecios() {
            const status = document.getElementById("status");
            const tbody = document.getElementById("tabla-body");
            status.innerText = "Conectando con servidor de mercado...";

            try {
                // Usamos la API pública de cotizaciones en batch que no genera conflictos de CORS en móviles
                const symbolsStr = TICKERS.join(",");
                const url = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${symbolsStr}`;
                
                // Usamos un proxy de respaldo ultra rápido (corsproxy.io)
                const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
                if (!res.ok) throw new Error("Error de red");
                
                const data = await res.json();
                const quotes = data.quoteResponse.result;

                tbody.innerHTML = "";

                quotes.forEach(q => {
                    const price = q.regularMarketPrice || 0;
                    const change = q.regularMarketChangePercent || 0;
                    const isPos = change >= 0;

                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${q.symbol}</strong> <span style="font-size:0.75rem; color:var(--muted)">(${q.shortName || ''})</span></td>
                            <td>$${price.toFixed(2)}</td>
                            <td class="${isPos ? 'pos' : 'neg'}">${isPos ? '+' : ''}${change.toFixed(2)}%</td>
                        </tr>
                    `;
                });

                status.innerText = "Actualizado: " + new Date().toLocaleTimeString();

            } catch (e) {
                status.innerText = "Error al actualizar. Reintentando...";
                console.error(e);
            }
        }

        window.onload = cargarPrecios;
    </script>
</body>
</html>
