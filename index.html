<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Yahoo</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        pre { background: #1e293b; padding: 15px; border-radius: 8px; margin-top: 15px; overflow-x: auto; font-size: 0.8rem; color: #38bdf8; max-height: 400px; }
    </style>
</head>
<body>
    <h2>Diagnóstico de Conexión Yahoo Finance</h2>
    <p>Haz clic para probar la conexión con AAPL:</p>
    <br>
    <button onclick="probarConexion()">Probar Conexión API</button>
    
    <pre id="resultado">Esperando prueba...</pre>

    <script>
        async function probarConexion() {
            const out = document.getElementById("resultado");
            out.innerText = "Conectando...";

            try {
                const url = "https://query1.finance.yahoo.com/v7/finance/quote?symbols=AAPL";
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                
                const res = await fetch(proxyUrl);
                
                if (!res.ok) {
                    throw new Error(`HTTP Error: ${res.status} ${res.statusText}`);
                }
                
                const data = await res.json();
                out.innerText = "¡CONEXIÓN EXITOSA!\n\n" + JSON.stringify(data, null, 2);
            } catch (err) {
                out.innerText = "ERROR DE CONEXIÓN:\n\n" + err.message + "\n\n(Es posible que tu red o el navegador bloqueen el proxy CORS en este dispositivo).";
            }
        }
    </script>
</body>
</html>
