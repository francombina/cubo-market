name: Actualizar Fundamentales SEC

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"   # Lunes a viernes 19:00 hs ARG (después del cierre NYSE)


permissions:
  contents: write

jobs:
  fetch-sec:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar extracción SEC
        run: python scripts/fetch_sec.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fundamentales.json
          git diff --staged --quiet || git commit -m "Actualizar fundamentales SEC"
          git push
